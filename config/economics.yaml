# Price per fish size — turns harvest into revenue on the Analyze board.
# Edit in the app: Configure -> Targets & prices.
#
# BANDS = the REAL sales weight ranges (operator, 2026-08-06), HOG basis,
# converted from lbs (1 lb = 0.45359 kg).
# PRICES = REAL defaults (operator, 2026-08-06), given in USD PER LB and
# converted to per kg (x2.20462). Per-lb originals in the comments.
# 12-16 lbs: operator chose "same as 10-12". 2-4 lbs $0.88/lb confirmed
# correct (not a typo).
currency: USD
basis: hog
# Sales-model harvest weight-distribution CV (%): each harvest event's kg is
# spread across the bands with a size-biased lognormal around the event's
# average weight (the operator's Excel LOGNORM method). Re-tune against
# historical harvest results as needed. 18 = 0.18 CV.
model_cv_pct: 18
# Per-band `monthly:` overrides the default price_per_kg for specific
# forecast months, e.g.
#     monthly:
#       2026-09: 9.10
price_bands:
  - min_kg: 0.0      # 0-2 lbs HOG @ $0.50/lb
    max_kg: 0.907
    price_per_kg: 1.10
  - min_kg: 0.907    # 2-4 lbs HOG @ $0.88/lb (confirmed, not a typo)
    max_kg: 1.814
    price_per_kg: 1.94
  - min_kg: 1.814    # 4-5.8 lbs HOG @ $9.02/lb
    max_kg: 2.631
    price_per_kg: 19.89
  - min_kg: 2.631    # 5.8-8 lbs HOG @ $9.13/lb
    max_kg: 3.629
    price_per_kg: 20.13
  - min_kg: 3.629    # 8-10 lbs HOG @ $10.12/lb
    max_kg: 4.536
    price_per_kg: 22.31
  - min_kg: 4.536    # 10-12 lbs HOG @ $10.06/lb
    max_kg: 5.443
    price_per_kg: 22.18
  - min_kg: 5.443    # 12-14 lbs HOG @ $10.06/lb (operator: same as 10-12)
    max_kg: 6.35
    price_per_kg: 22.18
  - min_kg: 6.35     # 14-16 lbs HOG @ $10.06/lb (operator: same as 10-12)
    max_kg: 7.257
    price_per_kg: 22.18
