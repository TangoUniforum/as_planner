# Control parameters (caps defaults, horizon, planner knobs).
# forecast_start is derived from the ProductionReport at run time;
# the value here is only a seed.
forecast_start: '2026-05-15'
horizon_weeks: 130
scenario_name: Forecast
max_feed_per_day_kg: 34000.0
max_biomass_kg: 3800000.0
# THE weekly processing LIMIT (operator semantic correction 2026-08-09):
# a CONSTRAINT the demand-driven harvest respects — never a level to plan
# up to. (The short-lived harvest_target_per_week knob is removed.)
max_harvest_per_week: 55000
# Pressure-relief band above the limit, as a fraction: the derived absolute
# ceiling is max_harvest_per_week * (1 + harvest_relief_pct) = 60,500.
# Relief is EXCEPTIONAL — the checklist warns at 1-3 relief weeks and fails
# beyond (or on any week past the ceiling): ramp harvests up earlier instead.
harvest_relief_pct: 0.10
min_harvest_weight_g: 3500.0
min_harvest_per_week: 30000.0
min_tank_control: 7000.0
# HANDLING BUDGET: max transfer moves/week. Deferrable quality passes stop
# at the cap; essential moves (rotation fills, arrival make-room, plan-diff)
# never blocked — overruns show on the handling gate instead. 0 = off.
max_transfers_per_week: 15
default_hog_yield: 0.81
facility_biomass_deviation_pct: 0.005
handling_mortality_pct: 0.01
sixn_growth: false
sixn_production_start: '2028-01-01'
sixn_transition_weeks: 0
tran_og_default_tanks: 2
global_buffer_pct: 0.05
starvation_period_days: 7
min_transfer_count: 7000.0
sixn_level_drains: true
density_target_pct: 0.9
density_welfare_threshold_kg_m3: 85.0
rebalance_varqty_budget: 20
rebalance_split_budget: 8
rebalance_balance_budget: 30
rebalance_level: true
harvest_level_load: true
harvest_smooth_lookahead_weeks: 12
harvest_level_target: null
placement_method: greedy
lns_max_moves: 30
auto_calibrate_fw: true
auto_calibrate_fw_min: 0.5
auto_calibrate_fw_max: 1.5
hybrid_follow: full
hybrid_follow_band: 0.05
hybrid_guide_min_frac: 0.25
hybrid_guide_smooth_weeks: 0
hybrid_purge_lever: true
hybrid_production_lever: true
