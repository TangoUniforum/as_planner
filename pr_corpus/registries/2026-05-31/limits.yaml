    feed_per_day: 3000.0
  OG5N:
    biomass: 400000.0
    feed_per_day: 3000.0
  OG5S:
    biomass: 400000.0
    feed_per_day: 3000.0
  OG6N:
    feed_per_day: 3000.0
    modes:
      production:
        biomass: 400000.0
      purge:
        biomass: 700000.0
  OG6S:
    biomass: 400000.0
    feed_per_day: 3000.0
